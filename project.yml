name: AppleCopilot
options:
  bundleIdPrefix: com.lakphy
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_GROUP_IDENTIFIER: group.com.lakphy.applecopilot
    KEYCHAIN_SHARED_SUFFIX: com.lakphy.applecopilot.shared
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  AppleCopilotShared:
    path: .
targets:
  AppleCopilot-iOS:
    type: application
    platform: iOS
    sources:
      - Sources/AppleCopilotApp
      - path: Resources/AppIcon.icon
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: Z262GH82B2
        PRODUCT_BUNDLE_IDENTIFIER: com.lakphy.applecopilot
        PRODUCT_NAME: Apple Copilot
        INFOPLIST_FILE: Configuration/iOS.Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: AppleCopilotShared
        product: CopilotCore
      - package: AppleCopilotShared
        product: CopilotUI
      - target: AppleCopilotTranslation
        embed: true
  AppleCopilotTranslation:
    type: extensionkit-extension
    platform: iOS
    sources: [Sources/TranslationExtension]
    settings:
      base:
        DEVELOPMENT_TEAM: Z262GH82B2
        PRODUCT_BUNDLE_IDENTIFIER: com.lakphy.applecopilot.translation
        PRODUCT_NAME: AppleCopilotTranslation
        INFOPLIST_FILE: Configuration/TranslationExtension.Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/TranslationExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: AppleCopilotShared
        product: CopilotCore
      - package: AppleCopilotShared
        product: CopilotUI
  AppleCopilot-macOS:
    type: application
    platform: macOS
    sources:
      - Sources/AppleCopilotApp
      - path: Resources/AppIcon.icon
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.lakphy.applecopilot.mac
        PRODUCT_NAME: Apple Copilot
        INFOPLIST_FILE: Configuration/Mac.Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Mac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: AppleCopilotShared
        product: CopilotCore
      - package: AppleCopilotShared
        product: CopilotUI
      - package: AppleCopilotShared
        product: MacIntegration
schemes:
  AppleCopilot-iOS:
    build:
      targets:
        AppleCopilot-iOS: all
  AppleCopilot-macOS:
    build:
      targets:
        AppleCopilot-macOS: all

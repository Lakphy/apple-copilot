name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: Please remove API keys, private text, and personal device identifiers from logs and screenshots.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App revision, OS version, Xcode version, platform, and API protocol. Do not include credentials.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized error messages or screenshots, and checks already tried.
